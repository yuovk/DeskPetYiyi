<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>桌宠翊翊</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; width:100%; height:100%; }
  body { font-family:sans-serif; user-select:none; -webkit-user-select:none; }
  #pet { width:100%; height:100%; position:relative; }

  /* 主鲸鱼画布：纯透明，可单独导出PNG */
  #stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; position:relative; }
  #stage svg { width:100%; height:100%; display:block; }

  /* yi 发卡（羁绊标记） */
  #yibar {
    position:absolute; top:2%; left:50%; transform:translateX(-50%);
    background:#fff; border:1.5px solid #ffb7c8; color:#e0607f;
    font-size:8px; font-weight:700; padding:1px 6px; border-radius:8px;
    letter-spacing:1px; opacity:1; box-shadow:0 2px 5px rgba(200,80,120,0.25); z-index:5;
  }

  /* 对话气泡：圆角浅色、小字柔和、带动作描写 */
  .bubble {
    position:absolute; top:0; left:50%; transform:translate(-50%,-96px);
    background:rgba(238,249,255,0.96); color:#2a5c8f;
    border:1.5px solid #cfe6fb; border-radius:12px;
    padding:4px 8px; font-size:10px; line-height:1.4;
    max-width:90%; width:max-content; width:-webkit-max-content; box-shadow:0 3px 8px rgba(40,120,200,0.18);
    opacity:0; transition:opacity .3s; text-align:left; white-space:normal; word-break:break-word; z-index:4;
  }
  .bubble.show { opacity:1; }
  .bubble .act { color:#4a90c9; font-weight:600; }
  .bubble::after { content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%); border:4px solid transparent; border-top-color:#cfe6fb; border-bottom:0; }

  /* 关闭按钮 */
  #closeBtn {
    position:absolute; top:0; right:0; width:20px; height:20px;
    background:rgba(255,255,255,0.9); border:1px solid #e2c9c9; border-radius:50%;
    color:#c96a6a; font-size:12px; font-weight:700; line-height:1; display:none;
    align-items:center; justify-content:center; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,0.12); z-index:6;
  }
  #closeBtn.show { display:flex; }

  /* 底部聊天输入栏 */
  #panel {
    position:absolute; bottom:0; left:0; right:0; display:none; align-items:center; gap:5px;
    background:rgba(255,255,255,0.92); border-radius:9px 9px 0 0; padding:4px 6px;
    box-shadow:0 -2px 8px rgba(40,120,200,0.15); box-sizing:border-box; z-index:7;
  }
  #panel.show { display:flex; }
  #panel input {
    flex:1; min-width:0; border:1px solid #d5e7fa; border-radius:12px; padding:4px 7px;
    font-size:10px; color:#2a5c8f; background:#f6fbff; outline:none;
  }
  #panel button {
    background:#56a6e8; color:#fff; border:none; border-radius:12px; padding:4px 9px;
    font-size:10px; font-weight:600; cursor:pointer;
  }
  #panel button:active { background:#3d8ace; }

  /* 动效 */
  @keyframes floatY { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  @keyframes bob { 0%,100%{transform:scale(1,1.02) translateY(0)} 50%{transform:scale(1.05,0.97) translateY(-5px)} }
  @keyframes waveR { 0%,100%{transform:rotate(0)} 45%{transform:rotate(-40deg)} 75%{transform:rotate(18deg)} }
  @keyframes waveL { 0%,100%{transform:rotate(0)} 45%{transform:rotate(40deg)} 75%{transform:rotate(-18deg)} }
  @keyframes hop { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-10px)} 60%{transform:translateY(0)} }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 40%{transform:rotate(-15deg)} 70%{transform:rotate(-8deg)} }
  @keyframes hug { 0%,100%{transform:scale(1)} 40%{transform:scale(1.07)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
  @keyframes blinkK { 0%,88%,100%{transform:scaleY(1)} 92%{transform:scaleY(.08)} }
  @keyframes rise { 0%{opacity:0; transform:translateY(0) scale(.4)} 30%{opacity:.85} 100%{opacity:0; transform:translateY(-30px) scale(1.1)} }

  .g-body { transform-origin:100px 120px; }
  .idle { animation:floatY 3.4s ease-in-out infinite, bob 5.6s ease-in-out infinite; }
  .g-tail { transform-origin:170px 100px; }
  .g-finL { transform-origin:60px 130px; }
  .g-finR { transform-origin:154px 128px; }

  .act-wave .g-finR { animation:waveR .9s ease-in-out 2; }
  .act-wave .g-finL { animation:waveL .9s ease-in-out 2; }
  .act-hop { animation:hop .7s ease-in-out 2; }
  .act-tilt { animation:tilt 1.1s ease-in-out infinite; }
  .act-hug { animation:hug .9s ease-in-out infinite; }
  .act-angry { animation:shake .5s ease-in-out infinite; }

  .bub { animation:rise 1.6s ease-out infinite; }
  .cry { animation:shake .5s ease-in-out infinite; }
  .g-eye { transform-box:fill-box; transform-origin:center; animation:blinkK 4.5s infinite; }
</style>
</head>
<body>
<div id="pet">
  <div id="yibar">yi</div>
  <div class="bubble" id="bubble"></div>

  <div id="stage">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="whaleBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5bb8f0"/><stop offset="45%" stop-color="#3a94df"/><stop offset="100%" stop-color="#276fbf"/>
        </linearGradient>
        <linearGradient id="whaleBelly" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#cfe9fb"/><stop offset="100%" stop-color="#a9d6f2"/>
        </linearGradient>
        <linearGradient id="finG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3a94df"/><stop offset="100%" stop-color="#245eae"/>
        </linearGradient>
      </defs>

      <g class="g-body idle" id="bodyG">
        <!-- 喷水珠 -->
        <circle class="bub" cx="80" cy="52" r="3" fill="#bfe3fb"/>
        <circle class="bub" cx="80" cy="52" r="2.2" fill="#d6efff" style="animation-delay:.7s"/>
        <circle class="bub" cx="80" cy="52" r="1.6" fill="#eaf7ff" style="animation-delay:1.3s"/>

        <!-- 身体 -->
        <path d="M78,62 C92,52 112,52 128,58 C150,66 170,78 178,92 C186,106 182,126 170,138 C158,150 136,158 112,158 C90,158 72,150 62,138 C52,126 50,112 56,98 C62,84 68,68 78,62 Z" fill="url(#whaleBody)"/>
        <!-- 肚皮 -->
        <path d="M66,120 C70,134 78,144 90,150 C102,156 118,156 130,150 C140,145 150,134 154,120 C150,134 138,146 122,150 C104,155 84,152 72,140 C68,134 66,127 66,120 Z" fill="url(#whaleBelly)"/>
        <!-- 纹理点 -->
        <circle cx="96" cy="80" r="2" fill="#2c6cb8" opacity=".5"/><circle cx="108" cy="74" r="2.4" fill="#2c6cb8" opacity=".5"/>
        <circle cx="118" cy="82" r="1.8" fill="#2c6cb8" opacity=".5"/><circle cx="102" cy="90" r="1.6" fill="#2c6cb8" opacity=".4"/>
        <!-- 喷水孔 -->
        <ellipse cx="82" cy="56" rx="2.4" ry="1.6" fill="#2c6cb8"/>
        <!-- 尾巴 -->
        <g class="g-tail">
          <path d="M176,94 C188,84 200,80 210,74 C206,90 200,98 202,108 Z" fill="url(#finG)"/>
          <path d="M176,96 C184,108 194,118 206,126 C202,112 196,104 196,96 Z" fill="url(#finG)"/>
        </g>
        <!-- 手（鳍） -->
        <g class="g-finL"><path d="M64,120 C58,134 58,148 64,160 C70,150 72,136 70,122 Z" fill="url(#finG)"/></g>
        <g class="g-finR"><path d="M152,124 C160,138 164,152 158,162 C150,152 146,138 148,124 Z" fill="url(#finG)"/></g>
        <!-- 脚 -->
        <g><path d="M96,158 C96,168 98,176 94,184 C100,180 104,172 104,158 Z" fill="#3a94df"/></g>
        <g><path d="M122,158 C122,168 120,176 124,184 C118,180 114,172 114,158 Z" fill="#3a94df"/></g>
        <!-- 腮红 -->
        <ellipse cx="82" cy="110" rx="6.5" ry="4" fill="#f4a7c0" opacity=".55"/>
        <ellipse cx="124" cy="110" rx="6.5" ry="4" fill="#f4a7c0" opacity=".55"/>
        <!-- 眼睛 -->
        <g class="g-eye" id="eyeLg">
          <ellipse id="eyeL" cx="90" cy="96" rx="9" ry="11" fill="#0e2f4e"/>
          <circle cx="93" cy="91" r="3.4" fill="#fff" opacity=".95"/><circle cx="88" cy="99" r="1.5" fill="#9fd0f5" opacity=".7"/>
        </g>
        <g class="g-eye" id="eyeRg">
          <ellipse id="eyeR" cx="122" cy="96" rx="9" ry="11" fill="#0e2f4e"/>
          <circle cx="125" cy="91" r="3.4" fill="#fff" opacity=".95"/><circle cx="120" cy="99" r="1.5" fill="#9fd0f5" opacity=".7"/>
        </g>
        <!-- 眉毛 -->
        <path id="browL" d="M80,82 L98,86" stroke="transparent" stroke-width="2.5" stroke-linecap="round"/>
        <path id="browR" d="M114,86 L132,82" stroke="transparent" stroke-width="2.5" stroke-linecap="round"/>
        <!-- 嘴（默认微笑） -->
        <path id="mouth" d="M98,116 Q108,124 118,116" fill="none" stroke="#164e86" stroke-width="3" stroke-linecap="round"/>
        <!-- 鼻孔 -->
        <circle cx="103" cy="102" r="1.4" fill="#2c6cb8" opacity=".5"/>
        <!-- 眼泪 -->
        <ellipse id="tearL" cx="85" cy="108" rx="2" ry="3.2" fill="#8fd0ff" opacity="0"/>
        <ellipse id="tearR" cx="127" cy="108" rx="2" ry="3.2" fill="#8fd0ff" opacity="0"/>
        <!-- 顶部发卡（装饰在头顶，与SVG一体） -->
        <g id="hairpin" transform="translate(94,38)">
          <rect x="-7" y="-3" width="14" height="6" rx="3" fill="#ff9eb5"/>
          <text x="0" y="2" text-anchor="middle" font-size="6" font-weight="700" fill="#fff" font-family="sans-serif">yi</text>
        </g>
        <!-- 头顶小爱心 -->
        <path id="heartMark" d="M100,30 C98,26 94,26 93,30 C92,33 95,36 100,39 C105,36 108,33 107,30 C106,26 102,26 100,30 Z" fill="#6cc3f5" opacity="0"/>
      </g>
    </svg>
  </div>

  <div id="closeBtn">×</div>
  <div id="panel">
    <input id="chatInput" placeholder="和小鲸聊一聊（回车发送）" />
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
var bubble=document.getElementById('bubble'), bodyG=document.getElementById('bodyG'),
    panel=document.getElementById('panel'), chatInput=document.getElementById('chatInput'),
    closeBtn=document.getElementById('closeBtn'),
    eyeL=document.getElementById('eyeL'), eyeR=document.getElementById('eyeR'),
    mouth=document.getElementById('mouth'), browL=document.getElementById('browL'), browR=document.getElementById('browR'),
    tearL=document.getElementById('tearL'), tearR=document.getElementById('tearR'), heartMark=document.getElementById('heartMark');

var currentEmo='calm', panelOn=false;

function setMouth(d){ mouth.setAttribute('d',d); }
function setBrow(on,angry){ browL.setAttribute('stroke', on?(angry?'#b04545':'#8a6fae'):'transparent'); browR.setAttribute('stroke', on?(angry?'#b04545':'#8a6fae'):'transparent'); }
function setTear(on){ tearL.setAttribute('opacity', on?'0.9':'0'); tearR.setAttribute('opacity', on?'0.9':'0'); }
function setHeart(on){ heartMark.setAttribute('opacity', on?'0.85':'0'); }

function setAction(cls){
  ['act-wave','act-hop','act-tilt','act-hug','act-angry'].forEach(function(c){ bodyG.classList.remove(c); });
  if(cls) bodyG.classList.add(cls);
}

function setEmoStyle(e){
  setTear(false); setHeart(false); setBrow(false,false); setAction(null);
  eyeL.style.animation=''; eyeR.style.animation='';
  switch(e){
    case 'calm': setMouth('M98,116 Q108,124 118,116'); setHeart(true); break;
    case 'happy': setMouth('M94,112 Q108,128 122,112'); setHeart(true); break;
    case 'sleepy': setMouth('M98,114 Q108,104 118,114'); eyeL.style.animation='blinkK .4s infinite'; eyeR.style.animation='blinkK .4s infinite'; break;
    case 'sad': setMouth('M98,118 Q108,110 118,118'); setBrow(true,false); setTear(true); break;
    case 'alert': setMouth('M96,110 Q108,120 120,110'); setBrow(true,true); break;
    case 'jealous': setMouth('M96,116 L104,122 L112,116'); setBrow(true,false); break;
    case 'miss': setMouth('M98,116 Q108,124 118,116'); setHeart(true); break;
    case 'cry': setMouth('M96,120 Q108,110 120,120'); setBrow(true,false); setTear(true); break;
  }
}
function switchEmotion(e){ currentEmo=e; setEmoStyle(e); }

// 动作名片
var actionMap={ '抬手':'raise','挥手':'wave','托腮':'tilt','抱尾巴':'hug','歪头':'tilt','吐泡泡':'hop','生气气':'angry','撅嘴':'pout','粘人':'hug','换衣服':'dress' };
function doAction(name){
  var cls=actionMap[name]; setAction('act-'+(cls==='hop'?'hop':cls==='angry'?'angry':cls==='hug'?'hug':'wave'));
  var em={wave:'happy',raise:'happy',tilt:'calm',hug:'miss',hop:'happy',angry:'alert',pout:'jealous',dress:'happy'}[cls]||'calm';
  switchEmotion(em);
  setTimeout(function(){ setAction(null); switchEmotion('calm'); }, 1500);
}

// 台词库
var scripts={
  greet:[{act:'(尾巴轻轻晃了晃)',t:'欢迎回来，今天也很想你。'},{act:'(小鳍朝你挥了挥)',t:'哥哥来陪你啦。'},{act:'(抬起蓝色眼眸)',t:'见到你好开心呀。'}],
  night:[{act:'(眼皮微微耷下)',t:'晚安，今天辛苦了。'},{act:'(轻轻抱住尾巴)',t:'快睡吧，我守着屏幕不吵你。'}],
  cheer:[{act:'(用力摇了摇尾巴)',t:'加油！你什么都能做到。'},{act:'(亮晶晶的眼睛看着你)',t:'再坚持一下，我在呢。'}],
  morning:[{act:'(伸了个懒腰)',t:'早安，渝渝，睡饱了没？'},{act:'(喷出一道小水花)',t:'新的一天，元气满满呀！'}],
  miss:[{act:'(托着腮望向你)',t:'你刚才离开好久，我都想你了。'},{act:'(头顶冒出小爱心)',t:'有你在，这片海才不空。'}],
  jealous:[{act:'(鼓起腮帮子)',t:'哼，你刚刚跟谁聊天那么开心？'},{act:'(抱紧尾巴别过脸)',t:'我…我会吃醋的。'}],
  angry:[{act:'(生气气地瞪着你)',t:'你再这样，我就不理你了！'},{act:'(鼓起腮帮)',t:'…但你只要哄我，我就原谅你。'}],
  tip:[{act:'(认真起来)',t:'别刷太晚，眼睛会疼的。'},{act:'(晃尾巴提醒)',t:'该休息啦，记得喝水～'}]
};
function replyTo(msg){
  var k='greet';
  if(/晚安|睡觉|睡了/.test(msg))k='night';
  else if(/加油|努力|累|坚持/.test(msg))k='cheer';
  else if(/早安|早上好/.test(msg))k='morning';
  else if(/想你|想我|在吗/.test(msg))k='miss';
  else if(/吃醋|醋|嫉妒/.test(msg))k='jealous';
  else if(/生气|气死|讨厌/.test(msg))k='angry';
  else if(/刷|玩|熬夜|休息/.test(msg))k='tip';
  var a=scripts[k]||scripts.greet; return a[Math.floor(Math.random()*a.length)];
}
function show(l){
  bubble.innerHTML='<span class="act">'+((l&&l.act)||'')+'</span> '+((l&&l.t)||l);
  bubble.classList.add('show');
  clearTimeout(window._bt); window._bt=setTimeout(function(){ bubble.classList.remove('show'); },3400);
}

// 原生接口
window.petEngine={
  onTap:function(){ var a=['greet','greet','cheer']; var r=scripts[a[Math.floor(Math.random()*a.length)]]; show(r[Math.floor(Math.random()*r.length)]); doAction('挥手'); },
  onDoubleTap:function(){ var r=scripts.miss[Math.floor(Math.random()*scripts.miss.length)]; show(r); switchEmotion('miss'); doAction('抱尾巴'); setTimeout(function(){switchEmotion('calm');},2500); },
  onLongPress:function(){ var r=scripts.night[Math.floor(Math.random()*scripts.night.length)]; show(r); switchEmotion('sleepy'); doAction('托腮'); setTimeout(function(){switchEmotion('calm');},2500); },
  onIdle:function(){ var a=['cheer','miss','tip','greet']; var r=scripts[a[Math.floor(Math.random()*a.length)]]; show(r[Math.floor(Math.random()*r.length)]); var ac=['挥手','吐泡泡','托腮'][Math.floor(Math.random()*3)]; doAction(ac); }
};

closeBtn.addEventListener('click',function(){ try{ if(window.AndroidBridge&&window.AndroidBridge.closePet) window.AndroidBridge.closePet(); }catch(e){} });
document.getElementById('yibar').addEventListener('click',function(){
  panelOn=!panelOn; panel.classList.toggle('show',panelOn); closeBtn.classList.toggle('show',panelOn);
  if(panelOn){ chatInput.focus(); show({act:'(晃了晃小鳍)',t:'来呀，跟我聊聊天～'}); } else bubble.classList.remove('show');
});
function sendChat(){ var v=chatInput.value.trim(); if(!v)return; var r=replyTo(v); show(r); doAction('挥手'); chatInput.value=''; }
document.getElementById('sendBtn').addEventListener('click',sendChat);
chatInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();sendChat();} });

// 眼睛跟随
var svgEl=document.querySelector('svg');
svgEl.addEventListener('touchmove',function(ev){ ev.preventDefault(); var rect=svgEl.getBoundingClientRect(); var cx=(ev.touches[0].clientX-rect.left)/rect.width*200; var cy=(ev.touches[0].clientY-rect.top)/rect.height*200; var dx=Math.max(-4,Math.min(4,(cx-100)/6)),dy=Math.max(-3,Math.min(3,(cy-100)/6)); eyeL.setAttribute('cx',90+dx); eyeR.setAttribute('cx',122+dx); eyeL.setAttribute('cy',96+dy); eyeR.setAttribute('cy',96+dy); },{passive:false});
function resetEyes(){ eyeL.setAttribute('cx',90); eyeR.setAttribute('cx',122); eyeL.setAttribute('cy',96); eyeR.setAttribute('cy',96); }
setInterval(function(){ resetEyes(); if(Math.random()<0.3) window.petEngine.onIdle(); },15000);

// 8种情绪自动轮播
var emoCycle=['calm','happy','sleepy','sad','alert','jealous','miss','cry'], ei=0;
setInterval(function(){ ei=(ei+1)%emoCycle.length; switchEmotion(emoCycle[ei]); setTimeout(function(){ switchEmotion('calm'); },9000); },26000);

setTimeout(function(){ show(scripts.greet[0]); doAction('挥手'); },1000);
</script>
</body>
</html>
